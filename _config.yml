# ─────────────────────────────────────────────
# SITE SETTINGS — edit these first
# ─────────────────────────────────────────────
title: "Star Eye Center and General Surgery Clinic"                 # TODO: real clinic name
tagline: "Comprehensive Eye Care & Ocular Trauma Center"
description: >-
  Clarity Eye Institute provides complete ophthalmic care and 24/7 ocular
  trauma services, from routine eye exams to emergency eye surgery.
url: "https://pranik-ops.github.io"      # TODO: no trailing slash
baseurl: "/Starsurgeryclinic"                    # TODO: match your repo name exactly (project repo)
repository: "pranik-ops.github.io/Starsurgeryclinic" # TODO: used by some MM features
locale: "en-US"

# Clinic identity (reused across schema includes + layouts)
clinic:
  legal_name: "Star Eye Center and General Surgery Clinic"
  phone: "+91-7303 773 733"
  emergency_phone: "+91-7303 773 733"
  email: "info@example.com"
  address:
    street: "Jaisingh Chowk, Rampura- Hayatpur Road, Opposite Pyramid Society, Sector 85"
    city: "Gurugram"
    region: "Haryana"
    postal_code: "122505"
    country: "India"
  geo:
    latitude: 28.39603796932855
    longitude: 76.9515003239358
  hours: "Mon–Sat 9:00 AM–6:00 PM; Emergency trauma line 24/7"
  founded: "2024"

# ─────────────────────────────────────────────
# THEME
# ─────────────────────────────────────────────
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"               # try "air", "contrast", "dark" etc.

# ─────────────────────────────────────────────
# PLUGINS
# ─────────────────────────────────────────────
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-paginate

# ─────────────────────────────────────────────
# BUILD SETTINGS
# ─────────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: /:categories/:title/

include:
  - _pages
  - robots.txt
  - llms.txt

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - node_modules

# ─────────────────────────────────────────────
# COLLECTIONS
# One collection per repeating content type. Each becomes browsable
# at /conditions/, /treatments/, /doctors/, /case-studies/.
# ─────────────────────────────────────────────
collections:
  conditions:
    output: true
    permalink: /conditions/:path/
  treatments:
    output: true
    permalink: /treatments/:path/
  doctors:
    output: true
    permalink: /doctors/:path/
  case_studies:
    output: true
    permalink: /case-studies/:path/
  testimonials:
    output: false          # pulled into pages via Liquid, not standalone pages

# ─────────────────────────────────────────────
# DEFAULTS — applied per collection so you don't repeat front matter
# ─────────────────────────────────────────────
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single
      author_profile: false

  - scope:
      path: ""
      type: "conditions"
    values:
      layout: condition
      sitemap: true
      toc: true

  - scope:
      path: ""
      type: "treatments"
    values:
      layout: condition        # treatments reuse the same layout/schema pattern
      sitemap: true
      toc: true

  - scope:
      path: ""
      type: "doctors"
    values:
      layout: doctor
      sitemap: true

  - scope:
      path: ""
      type: "case_studies"
    values:
      layout: case-study
      sitemap: true

# ─────────────────────────────────────────────
# SEO / SOCIAL (used by jekyll-seo-tag)
# ─────────────────────────────────────────────
logo: "/assets/images/logo.png"
social:
  type: "MedicalClinic"
  name: "Star Eye Center and General Surgery Clinic"
  links:
    - "https://www.facebook.com/YOUR-PAGE"
    - "https://www.instagram.com/YOUR-HANDLE"
    - "https://www.linkedin.com/company/YOUR-COMPANY"

# ─────────────────────────────────────────────
# NAVIGATION (Minimal Mistakes reads this from _data/navigation.yml)
# ─────────────────────────────────────────────
